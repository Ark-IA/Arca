# Supabase CLI configuration.
#
# This file exists for ONE reason: the CI job in
# `.github/workflows/migrations.yml` needs a project directory the CLI
# recognises before it can boot a throwaway Postgres and replay
# `supabase/migrations/` against it.
#
# It is NOT a mirror of the deployed instance's settings. Auth
# providers, storage limits, SMTP, rate limits and the rest live in
# that instance's own configuration and are deliberately left out here
# rather than duplicated into a second source of truth that would
# quietly drift. Run `supabase init` if you ever want the CLI's full
# annotated reference version of this file.
#
# (It was briefly replaced by exactly that 415-line reference dump when
# the custom-objects branch was merged in September 2026. Restored:
# every one of those defaults described a setting nobody had configured
# and nothing read.)
project_id = "arca"

[db]
port = 54322
shadow_port = 54320
# Keep this aligned with the DEPLOYED Postgres version. Supabase here
# is self-hosted in Docker on the VPS, not Supabase Cloud, so read it
# from the running container rather than from a dashboard:
#
#   docker exec <contenedor-db> psql -U postgres -tAc 'show server_version'
#
# A mismatch means CI can green-light SQL the production database would
# reject, which is the one failure mode this whole check exists to
# prevent. 17 is the CLI's current default, not a reading of the live
# instance.
major_version = 17
